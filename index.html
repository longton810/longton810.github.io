  <script>
(() => {
  const menu = document.querySelector('nav[aria-label="Dental notes"]');
  const cards = [...menu.querySelectorAll('.tool')];
  const storageKey = 'dental-notes-menu-order';
  const cardId = card => new URL(card.href).pathname;
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
    if (Array.isArray(saved)) {
      const remaining = new Map(cards.map(card => [cardId(card), card]));
      saved.forEach(id => { if (remaining.has(id)) { menu.append(remaining.get(id)); remaining.delete(id); } });
      remaining.forEach(card => menu.append(card));
    }
  } catch {}
  const save = () => { try { localStorage.setItem(storageKey, JSON.stringify([...menu.querySelectorAll('.tool')].map(cardId))); } catch {} };
  let dragging = null, target = null, suppressClickUntil = 0;
  const clearTarget = () => { if (target) target.classList.remove('drop-target'); target = null; };
  const finish = () => {
    clearTarget();
    if (dragging) dragging.classList.remove('dragging');
    dragging = null;
    suppressClickUntil = Date.now() + 250;
  };
  cards.forEach(card => {
    card.draggable = true;
    card.title = 'Click to open; drag to rearrange';
    card.addEventListener('dragstart', event => {
      dragging = card;
      card.classList.add('dragging');
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', cardId(card));
    });
    card.addEventListener('dragend', finish);
    card.addEventListener('click', event => { if (dragging || Date.now() < suppressClickUntil) event.preventDefault(); });
  });
  menu.addEventListener('dragover', event => {
    if (!dragging) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    const next = event.target.closest('.tool');
    if (next === target) return;
    clearTarget();
    if (next && next !== dragging && menu.contains(next)) { target = next; target.classList.add('drop-target'); }
  });
  menu.addEventListener('dragleave', event => { if (!menu.contains(event.relatedTarget)) clearTarget(); });
  menu.addEventListener('drop', event => {
    if (!dragging) return;
    event.preventDefault();
    if (target) {
      const rect = target.getBoundingClientRect();
      const multipleColumns = getComputedStyle(menu).gridTemplateColumns.split(' ').length > 1;
      const after = multipleColumns ? event.clientX > rect.left + rect.width / 2 : event.clientY > rect.top + rect.height / 2;
      menu.insertBefore(dragging, after ? target.nextSibling : target);
      save();
    }
    finish();
  });
})();
  </script>
  <script>
(() => {
  const portrait = document.querySelector('.portrait-wrap');
  const pupils = [...document.querySelectorAll('.tracking-pupil')];
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  if (!portrait || !pupils.length) return;
  let frame = 0, cursor = null;
  const center = () => { cursor = null; pupils.forEach(pupil => pupil.setAttribute('transform', 'translate(0 0)')); };
  document.addEventListener('pointermove', event => {
    if (event.pointerType === 'touch' || reducedMotion.matches) return;
    cursor = { x: event.clientX, y: event.clientY };
    if (frame) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      if (!cursor) return;
      const rect = portrait.getBoundingClientRect();
      const dx = cursor.x - rect.left - rect.width / 2;
      const dy = cursor.y - rect.top - rect.height * .4;
      const distance = Math.hypot(dx, dy);
      const amount = Math.min(18, distance / 15);
      const x = distance ? dx / distance * amount : 0;
      const y = distance ? dy / distance * amount : 0;
      pupils.forEach(pupil => pupil.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)})`));
    });
  }, { passive: true });
  document.documentElement.addEventListener('pointerleave', center);
  window.addEventListener('blur', center);
  reducedMotion.addEventListener('change', center);
})();
  </script>
  <script>
(() => {
  const portrait = document.querySelector('.portrait-wrap');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  if (!portrait) return;
  let blinkTimer, talkTimer, blinkEnd, talkEnd;
  const stop = () => {
    [blinkTimer, talkTimer, blinkEnd, talkEnd].forEach(clearTimeout);
    portrait.classList.remove('is-blinking', 'is-talking');
  };
  const blink = () => {
    if (document.hidden || reducedMotion.matches) return;
    portrait.classList.add('is-blinking');
    blinkEnd = setTimeout(() => portrait.classList.remove('is-blinking'), 220);
    blinkTimer = setTimeout(blink, 4500 + Math.random() * 4500);
  };
  const talk = () => {
    if (document.hidden || reducedMotion.matches) return;
    portrait.classList.add('is-talking');
    talkEnd = setTimeout(() => portrait.classList.remove('is-talking'), 900 + Math.random() * 800);
    talkTimer = setTimeout(talk, 13000 + Math.random() * 10000);
  };
  const start = () => {
    stop();
    if (document.hidden || reducedMotion.matches) return;
    blinkTimer = setTimeout(blink, 3000);
    talkTimer = setTimeout(talk, 8000);
  };
  document.addEventListener('visibilitychange', start);
  reducedMotion.addEventListener('change', start);
  start();
})();
  </script>
  <script>
(() => {
  const clock = document.getElementById('homepageTime');
  const date = document.getElementById('homepageDate');
  const timeFormat = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  const dateFormat = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  let timer;
  const update = () => {
    const now = new Date();
    clock.textContent = timeFormat.format(now);
    clock.dateTime = now.toISOString();
    date.textContent = dateFormat.format(now);
    date.dateTime = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  };
  const resume = () => {
    clearInterval(timer);
    update();
    if (!document.hidden) timer = setInterval(update, 1000);
  };
  document.addEventListener('visibilitychange', resume);
  resume();
})();
  </script>
