<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Quick access to Long Ton's dental charting and clinical note tools.">
  <title>Dental Notes | Long Ton</title>
  <link rel="stylesheet" href="style.css?v=homepage-cleanup-1">
</head>
<body>
  <div class="homepage-layout">
  <main>
    <fieldset class="homepage-panel">
    <img class="menu-ghost" src="assets/halloween-ghost-boo.svg" alt="Friendly ghost saying BOO" width="159" height="156">
    <header>
      <div class="title-row">
        <span class="tooth-visual" aria-hidden="true">
          <img class="hero-tooth" src="tooth-avatar.png" alt="" width="126" height="140">
          
        </span>
        <h1 class="notes-title">Dental Notes</h1>
        <div class="profile-card">
          <div class="profile-details">
            <img class="profile-bats" src="assets/halloween-two-bats.svg" alt="Two Halloween bats" width="147" height="126">
            <div class="eyebrow profile-name">Long Ton</div>
            <div class="profile-role">D4 dental student</div>
          </div>
          <span class="profile-artwork">
          <span class="portrait-wrap">
            <span class="portrait-character">
              <img class="profile-portrait" src="crossed-arms.png" alt="Long Ton with crossed arms" width="126" height="126">
              <img class="profile-portrait portrait-blink-frame" src="crossed-arms-blink.png" alt="" aria-hidden="true" width="126" height="126">
            </span>
          </span>
          </span>
        </div>
      </div>
    </header>

    <nav aria-label="Dental notes">
      <a class="tool" href="https://longton810.github.io/odontogram/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3c-3 0-5 2-5 5 0 3 2 4 3 8 1 4 2 5 3 5s1-7 3-7 2 7 3 7 2-1 3-5c1-4 3-5 3-8 0-3-2-5-5-5-2 0-3 1-4 1s-2-1-4-1Z"/></svg></span>
        <h2>Odontogram</h2>
      </a>
      <a class="tool screening" href="https://longton810.github.io/nps/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M8 11h8M8 15h8M8 18h5"/></svg></span>
        <h2>NPS &amp; Emergency</h2>
      </a>
      <a class="tool coe" href="https://longton810.github.io/coe/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="13" height="17" rx="2"/><rect x="8" y="2" width="5" height="4" rx="1"/><path d="M7 10h5M7 14h3M7 18h5"/><circle cx="17" cy="12" r="4"/><path d="m20 15 3 3"/></svg></span>
        <h2>COE</h2>
      </a>
      <a class="tool medical" href="https://longton810.github.io/consult/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M12 9v6M9 12h6M8 18h8"/></svg></span>
        <h2>Medical consult</h2>
      </a>
      <a class="tool referral" href="https://longton810.github.io/referral/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M14 3h7v7M21 3l-9 9M7 16h8M7 18h5"/></svg></span>
        <h2>Referral</h2>
      </a>
      <a class="tool composite" href="https://longton810.github.io/composite/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3c-3 0-5 2-5 5 0 3 2 4 3 8 1 4 2 5 3 5s1-7 3-7 2 7 3 7 2-1 3-5c1-4 3-5 3-8 0-3-2-5-5-5-2 0-3 1-4 1s-2-1-4-1Z"/><path d="M10 7h4l1 2-1 2h-4L9 9Z" fill="currentColor" fill-opacity=".3"/></svg></span>
        <h2>Composite</h2>
      </a>
      <a class="tool extraction" href="https://longton810.github.io/extraction/" data-local-href="../Extraction/index.html" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 7c-3 0-5 2-5 5 0 2 2 3 3 6 1 3 2 4 3 4s1-6 3-6 2 6 3 6 2-1 3-4c1-3 3-4 3-6 0-3-2-5-5-5-2 0-3 1-4 1s-2-1-4-1Z"/><path d="M12 9V2M9 5l3-3 3 3"/></svg></span>
        <h2>Extraction</h2>
      </a>
      <a class="tool rct" href="https://longton810.github.io/rct/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3c-3 0-5 2-5 5 0 3 2 4 3 8 1 4 2 5 3 5s1-7 3-7 2 7 3 7 2-1 3-5c1-4 3-5 3-8 0-3-2-5-5-5-2 0-3 1-4 1s-2-1-4-1Z"/><path d="M12 7v5M12 10l-3 7M12 10l3 7" stroke-width="2.2"/></svg></span>
        <h2>RCT</h2>
      </a>
      <a class="tool crown" href="https://longton810.github.io/crown/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3c-3 0-5 2-5 5 0 3 2 4 3 8 1 4 2 5 3 5s1-7 3-7 2 7 3 7 2-1 3-5c1-4 3-5 3-8 0-3-2-5-5-5-2 0-3 1-4 1s-2-1-4-1Z"/><path d="M3 9h18M5 12h14"/><path d="M8 3c-3 0-5 2-5 5v1h18V8c0-3-2-5-5-5-2 0-3 1-4 1s-2-1-4-1Z" fill="currentColor" fill-opacity=".22"/></svg></span>
        <h2>Crown</h2>
      </a>
      <a class="tool recall" href="https://longton810.github.io/recall/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 10h18M9 16l2 2 4-4"/></svg></span>
        <h2>Recall</h2>
      </a>
    </nav>
    <p class="halloween-credit">Halloween illustrations designed by Freepik.</p>

    </fieldset>
  </main>
  <div class="homepage-clock" aria-label="Eastern time and date">
    <time id="homepageTime" class="clock-time"></time>
    <time id="homepageDate" class="clock-date"></time>
  </div>
  <div class="countdown-ticker" aria-label="Upcoming dates countdown">
    <div id="countdownTrack" class="countdown-track"></div>
  </div>
  </div>
  <script src="script.js?v=homepage-cleanup-1"></script>
</body>
</html>
