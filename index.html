<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Quick access to Long Ton's dental charting and clinical note tools.">
  <title>Dental Notes | Long Ton</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #20334b; background: #eaf2fc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 40px 28px 0;
      background: radial-gradient(ellipse at 8% 10%, rgba(103,169,255,.42), transparent 48%), radial-gradient(ellipse at 92% 25%, rgba(185,156,250,.35), transparent 48%), radial-gradient(ellipse at 45% 95%, rgba(112,220,203,.28), transparent 48%), linear-gradient(130deg,#f0f6ff,#e6eefb); background-attachment: fixed; }
    main { margin-top: auto; margin-bottom: 48px; flex-shrink: 0; width: min(100%, 1250px); padding: 42px; border: 1px solid rgba(255,255,255,.85); border-radius: 32px; background: rgba(255,255,255,.25); box-shadow: 0 24px 70px rgba(54,83,132,.10), inset 0 1px 0 rgba(255,255,255,.9); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
    header { margin-bottom: 34px; }
    .eyebrow { display: inline-block; padding: 7px 12px; border: 1px solid rgba(255,255,255,.85); border-radius: 999px; background: rgba(255,255,255,.5); font-size: 18px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #54708e; }
    .identity { display: flex; align-items: center; gap: 14px; }
    .eyebrow { flex-shrink: 0; }
    .school-name { margin-top: 0; color: #54708e; font-size: 11px; font-weight: 700; letter-spacing: .07em; line-height: 1.5; }
    h1 { margin: 18px 0 10px; font-size: clamp(32px,5vw,48px); letter-spacing: -.04em; }
    .title-row { display: flex; align-items: center; gap: 18px; margin: 14px 0 10px; }
    .title-row h1 { margin: 0; }
    .hero-tooth { width: 90px; height: 100px; object-fit: contain; flex-shrink: 0; overflow: visible; fill: none; stroke: none; filter: drop-shadow(0 8px 8px rgba(54,93,151,.2)); }
    @media (max-width: 480px) { .hero-tooth { width: 54px; height: 68px; } .title-row { gap: 12px; } }
    .intro { margin: 0; color: #536b86; font-size: 16px; line-height: 1.6; }
    nav { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 20px; }
    .tool { --accent: #2563eb; --flash: rgba(37,99,235,.28); --tint: rgba(111,170,255,.2); position: relative; overflow: hidden; display: flex; flex-direction: column; min-height: 190px; padding: 26px;
      text-decoration: none; color: inherit; border: 1px solid rgba(255,255,255,.95); border-radius: 24px;
      background: linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.36)); box-shadow: 0 10px 26px rgba(48,76,117,.07), inset 0 1px 0 white;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transition: transform .25s ease, box-shadow .25s ease, background .25s ease; }
    .tool::before { content: ''; position: absolute; width: 140px; height: 140px; top: -60px; right: -50px; border-radius: 50%; background: var(--tint); filter: blur(18px); pointer-events: none; }
    .tool::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(110deg,transparent 25%,var(--flash) 50%,transparent 75%); transform: translateX(-150%); }
    .tool:hover::after { animation: glass-flash .65s ease-out; }
    @keyframes glass-flash { from { transform: translateX(-150%); } to { transform: translateX(150%); } }
    .tool:hover { transform: translateY(-7px); background: linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.5)); box-shadow: 0 20px 38px rgba(48,76,117,.15), inset 0 1px 0 white; }
    .tool:active { transform: translateY(-2px); }
    .tool:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    .screening { --accent: #0f766e; --flash: rgba(15,118,110,.28); --tint: rgba(70,202,182,.22); }
    .composite { --accent: #7c3aed; --flash: rgba(124,58,237,.28); --tint: rgba(174,132,247,.22); }
    .recall { --accent: #b45309; --flash: rgba(180,83,9,.28); --tint: rgba(251,191,36,.22); }
    .medical { --accent: #be185d; --flash: rgba(190,24,93,.28); --tint: rgba(244,114,182,.22); }
    .icon { position: relative; width: 50px; height: 50px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.9); border-radius: 15px; color: var(--accent); background: linear-gradient(145deg,rgba(255,255,255,.9),var(--tint)); box-shadow: 0 5px 12px rgba(48,76,117,.06), inset 0 1px 0 white; margin-bottom: 24px; }
    svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    h2 { position: relative; color: var(--accent); font-size: 20px; line-height: 1.35; margin: 0 0 10px; letter-spacing: -.3px; }
    .homepage-art { display: block; width: min(100%, 240px); height: auto; margin: auto auto 0; flex-shrink: 0; }
    footer { margin-top: 28px; color: #536b86; font-size: 12px; }
    @media (min-width: 801px) and (max-width: 1000px) { nav { grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @media (max-width: 800px) { nav { grid-template-columns: 1fr; } .tool { min-height: 0; } main { padding: 26px; } body { padding: 24px 18px 0; } .icon { margin-bottom: 18px; } }
    @media (prefers-reduced-motion: reduce) { .tool:hover::after { animation: none; } .tool { transition: none; } .tool:hover,.tool:active { transform: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="identity"><div class="eyebrow">LONG TON</div><div class="school-name">LECOM SCHOOL OF DENTAL MEDICINE</div></div>
      <div class="title-row">
        <img class="hero-tooth" src="tooth-avatar.png" alt="" width="90" height="100">
        <h1>Dental Notes</h1>
      </div>
    </header>
    <nav aria-label="Dental notes">
      <a class="tool" href="https://longton810.github.io/odontogram/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3c-3 0-5 2-5 5 0 3 2 4 3 8 1 4 2 5 3 5s1-7 3-7 2 7 3 7 2-1 3-5c1-4 3-5 3-8 0-3-2-5-5-5-2 0-3 1-4 1s-2-1-4-1Z"/></svg></span>
        <h2>Odontogram</h2>
      </a>
      <a class="tool screening" href="https://longton810.github.io/nps/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M8 11h8M8 15h8M8 18h5"/></svg></span>
        <h2>New Patient Screening &amp; Emergency</h2>
      </a>
      <a class="tool composite" href="https://longton810.github.io/composite/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-9M14 3l7 7M14 3v7h7M7 14h10M7 17h7"/></svg></span>
        <h2>Composite Note</h2>
      </a>
      <a class="tool recall" href="https://longton810.github.io/recall/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 10h18M9 16l2 2 4-4"/></svg></span>
        <h2>Recall</h2>
      </a>
      <a class="tool medical" href="https://longton810.github.io/medicalconsultation/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M12 9v6M9 12h6M8 18h8"/></svg></span>
        <h2>Medical consult</h2>
      </a>
    </nav>
  </main>
    <img class="homepage-art" src="Dorsinians.png" alt="Dorsinians — LECOM School of Dental Medicine Class of 2027" width="3300" height="2550">
</body>
</html>
